<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocaFlight</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VocaFlight">
<meta name="theme-color" content="#f4f7fb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#0ea5e9;--pri2:#0369a1;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{font-size:26px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.stats{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 3px #0001}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.goal{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#22d3ee);border-radius:99px;transition:width .3s}
.btn{font:inherit;font-weight:700;font-size:17px;border:none;border-radius:16px;padding:17px;cursor:pointer;width:100%}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri2)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4}
.menu{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:none;background:none;padding:9px;border-radius:9px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.badge{font-size:12px;font-weight:700;background:#e0f2fe;color:var(--pri2);padding:4px 10px;border-radius:99px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{font-size:24px;background:none;border:none;color:var(--sub);cursor:pointer;padding:4px}
.qtop .bar{flex:1;margin:0}
.combo{font-weight:800;color:var(--gold);font-size:14px;min-width:44px;text-align:right}
.qtype{font-size:13px;font-weight:700;color:var(--pri2);margin-bottom:10px}
.qmain{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:8px;word-break:keep-all}
.qmain .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--pri);color:var(--pri);text-align:center}
.qsub{font-size:16px;color:var(--sub);line-height:1.5;margin-bottom:22px}
.qword{font-size:40px;font-weight:800;text-align:center;margin:30px 0 8px}
.spk{font:inherit;border:none;background:#e0f2fe;color:var(--pri2);border-radius:99px;padding:10px 16px;font-weight:700;cursor:pointer;margin-bottom:18px;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:18px;font-weight:600;text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.opt.right{border-color:var(--ok);background:#dcfce7}
.opt.wrong{border-color:var(--bad);background:#fee2e2}
input.type{font:inherit;font-size:22px;padding:16px;border-radius:14px;border:2px solid var(--line);width:100%;outline:none;margin-bottom:12px;background:#fff}
input.type:focus{border-color:var(--pri)}
input.type.right{border-color:var(--ok);background:#dcfce7}
input.type.wrong{border-color:var(--bad);background:#fee2e2}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s;z-index:5}
.fb.show{transform:none}
.fb.ok{background:#dcfce7}.fb.no{background:#fee2e2}
.fb .in{max-width:444px;margin:0 auto}
.fb h3{font-size:20px;margin-bottom:6px}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb p{font-size:15px;line-height:1.5;margin-bottom:4px}
.fb .k{color:var(--sub);margin-bottom:14px}
.fb.ok .btn{background:var(--ok);box-shadow:0 4px 0 #15803d;color:#fff}
.fb.no .btn{background:var(--bad);box-shadow:0 4px 0 #991b1b;color:#fff}
/* result */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.big{font-size:56px}
/* wordbook */
.wl{display:flex;flex-direction:column;gap:8px;overflow:auto}
.wi{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wi b{font-size:16px}.wi small{color:var(--sub);font-size:13px;display:block}
.dots{letter-spacing:2px;color:var(--pri);font-size:12px;white-space:nowrap}
.muted{color:var(--sub);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section class="screen" id="home">
  <div class="row" style="justify-content:space-between">
    <h1>VocaFlight ✈️</h1>
    <span class="badge" id="lvBadge">Lv.1</span>
  </div>
  <div class="stats">
    <div class="stat"><b id="sStreak">0</b><span>🔥 연속 학습일</span></div>
    <div class="stat"><b id="sXP">0</b><span>⭐ 오늘 XP</span></div>
    <div class="stat"><b id="sLearned">0</b><span>📚 학습 단어</span></div>
  </div>
  <div class="goal">
    <div class="row" style="justify-content:space-between"><b>오늘의 목표</b><span class="muted" id="goalTxt">0 / 30문제</span></div>
    <div class="bar"><i id="goalBar" style="width:0"></i></div>
  </div>
  <div class="seg" id="course">
    <button data-c="mix" class="on">섞기</button>
    <button data-c="av">✈️ 항공</button>
    <button data-c="gen">📚 단어</button>
    <button data-c="ex">💬 회화</button>
  </div>
  <div class="menu">
    <button class="btn pri" id="bLearn">학습 시작 (10문제)</button>
    <button class="btn sec" id="bReview">복습하기</button>
    <button class="btn sec" id="bListen">🎧 듣기 퀴즈</button>
    <button class="btn sec" id="bBook">📖 단어장</button>
  </div>
  <p class="muted" style="margin-top:auto;padding-top:20px;text-align:center"><a href="#" id="bRetest" style="color:var(--sub)">레벨 테스트 다시 하기</a></p>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <div class="qtop">
    <button class="x" id="qx">✕</button>
    <div class="bar"><i id="qBar"></i></div>
    <span class="combo" id="combo"></span>
  </div>
  <div id="qBody" style="display:flex;flex-direction:column"></div>
</section>

<!-- RESULT -->
<section class="screen" id="result">
  <div class="center">
    <div class="big" id="rEmoji">🎉</div>
    <h1 id="rTitle">학습 완료!</h1>
    <p class="muted" id="rTxt"></p>
  </div>
  <div class="menu">
    <button class="btn pri" id="rAgain">한 세트 더</button>
    <button class="btn sec" id="rHome">홈으로</button>
  </div>
</section>

<!-- WORDBOOK -->
<section class="screen" id="book">
  <div class="qtop"><button class="x" id="bx">✕</button><h1 style="font-size:20px">단어장</h1></div>
  <div class="seg" id="bookSeg">
    <button data-b="all" class="on">전체</button>
    <button data-b="weak">약한 단어</button>
    <button data-b="master">마스터</button>
  </div>
  <div class="wl" id="wl"></div>
</section>

<!-- LEVEL TEST INTRO -->
<section class="screen" id="intro">
  <div class="center">
    <div class="big">✈️</div>
    <h1>VocaFlight</h1>
    <p class="muted">먼저 10문제로 레벨을 확인할게요.<br>모르면 찍지 말고 "모르겠어요"를 눌러주세요.</p>
  </div>
  <button class="btn pri" id="bTest">레벨 테스트 시작</button>
</section>

</div>

<div class="fb" id="fb"><div class="in">
  <h3 id="fbH"></h3><p id="fbS"></p><p class="k" id="fbK"></p>
  <button class="btn" id="fbNext">계속</button>
</div></div>

<script>
// ===== WORD BANK =====  w, pos, ko, s(sentence containing w), sk, lv(1-5), c(gen/av)

["decide","v","결정하다","I can't decide what to eat.","뭘 먹을지 못 정하겠어.",1,"gen"],

["available","adj","시간이 되는, 이용 가능한","Are you available tomorrow?","내일 시간 돼?",2,"gen"],
["schedule","n","일정","My schedule is full this week.","이번 주 일정이 꽉 찼어.",2,"gen"],

["takeoff","n","이륙","The takeoff was smooth.","이륙이 부드러웠다.",1,"av"],
["cockpit","n","조종석","The captain is in the cockpit.","기장은 조종석에 있다.",1,"av"],

// ===== STORAGE =====
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAY=864e5, today=()=>new Date().toDateString();
let S=LS.get("vf",null)||{level:0,cards:{},streak:0,lastDay:"",xpDay:"",xp:0,done:0,recent:[]};
if(S.xpDay!==today()){S.xpDay=today();S.xp=0;S.done=0}
const save=()=>LS.set("vf",S);
const GOAL=30, INTV=[0,1,3,7,14,30];
let course="mix";

// ===== HELPERS =====
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rx=w=>new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
const inCourse=w=>course==="mix"||w.c===course;
const card=w=>S.cards[w.id];
function distractors(w,field,n=3){
  let p=W.filter(x=>x.id!==w.id&&x.pos===w.pos&&x.c===w.c&&Math.abs(x.lv-w.lv)<=1);
  if(p.length<n)p=W.filter(x=>x.id!==w.id&&x.pos===w.pos);
  if(p.length<n)p=W.filter(x=>x.id!==w.id);
  const seen=new Set([w[field]]);const out=[];
  for(const x of shuffle(p)){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length===n)break}
  return out;
}
const dueList=()=>W.filter(w=>inCourse(w)&&card(w)&&card(w).due<=Date.now());

// ===== HOME =====
function renderHome(){
  $("lvBadge").textContent="Lv."+(S.level||1);
  $("sStreak").textContent=S.streak;
  $("sXP").textContent=S.xp;
  $("sLearned").textContent=Object.keys(S.cards).length;
  $("goalTxt").textContent=Math.min(S.done,GOAL)+" / "+GOAL+"문제"+(S.done>=GOAL?" ✅":"");
  $("goalBar").style.width=Math.min(100,S.done/GOAL*100)+"%";
  const d=dueList().length;
  $("bReview").textContent=d?`복습하기 (${d}개 대기 중)`:"복습하기 (지금은 없음)";
  $("bReview").disabled=!d;
  show("home");
}
$("course").onclick=e=>{const b=e.target.closest("button");if(!b)return;course=b.dataset.c;$("course").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderHome()};

// ===== SESSION =====
let Q=[],qi=0,combo=0,right=0,mode="learn",sessXP=0;
function buildSession(m){
  mode=m;let words=[];
  if(m==="test"){
    for(let lv=1;lv<=5;lv++)words.push(...shuffle(W.filter(w=>w.lv===lv&&w.c==="gen")).slice(0,2));
    Q=words.map(w=>({w,type:"meaning"}));
  }else{
    const due=shuffle(dueList());
    if(m==="review")words=due.slice(0,10);
    else{
      words=due.slice(0,5);
      const lv=S.level||1;
      let fresh=shuffle(W.filter(w=>inCourse(w)&&!card(w)&&w.lv<=lv)).sort((a,b)=>b.lv-a.lv);
      if(fresh.length<10)fresh=fresh.concat(shuffle(W.filter(w=>inCourse(w)&&!card(w)&&w.lv>lv)).sort((a,b)=>a.lv-b.lv));
      words=words.concat(fresh.slice(0,10-words.length));
      if(words.length<10)words=words.concat(shuffle(W.filter(w=>inCourse(w)&&!words.includes(w))).slice(0,10-words.length));
    }
    Q=shuffle(words).map(w=>{
      if(m==="listen")return{w,type:"listen"};
      const b=card(w)?card(w).box:0;
      const types=w.c==="ex"?(b===0?["meaning","reverse"]:["blank","reverse","listen"]):b===0?["meaning","blank"]:b<3?["blank","blank","listen","type"]:["type","listen","blank"];
      return{w,type:types[Math.random()*types.length|0]};
    });
  }
  qi=0;combo=0;right=0;sessXP=0;
  if(!Q.length){renderHome();return}
  show("quiz");renderQ();
}

function renderQ(){
  const {w,type}=Q[qi];
  $("qBar").style.width=(qi/Q.length*100)+"%";
  $("combo").textContent=combo>=3?"🔥"+combo:"";
  const blankS=esc(w.s).replace(rx(w.w),'<span class="blank">?</span>');
  let h="";
  if(type==="meaning"){
    h=`<div class="qtype">${mode==="test"?"레벨 테스트 · ":""}뜻 고르기</div><div class="qword" style="${w.w.length>14?"font-size:28px":""}">${esc(w.w)}</div><button class="spk" style="align-self:center" data-say="${esc(w.w)}">🔊 발음</button>`;
    const opts=shuffle([w.ko,...distractors(w,"ko")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}${mode==="test"?`<button class="opt" data-v="__idk" style="color:var(--sub)">모르겠어요</button>`:""}</div>`;
  }else if(type==="reverse"){
    h=`<div class="qtype">💬 이럴 때 영어로?</div><div class="qmain">${esc(w.ko)}</div><div class="qsub">상황: ${esc(w.sk)}</div>`;
    const opts=shuffle([w.w,...distractors(w,"w")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }else if(type==="blank"||type==="listen"){
    h=`<div class="qtype">${type==="listen"?"🎧 듣고 빈칸 채우기":"빈칸에 알맞은 단어"}</div>`;
    if(type==="listen")h+=`<button class="spk" id="play">🔊 다시 듣기</button><div class="qsub">${esc(w.sk)}</div>`;
    else h+=`<div class="qmain">${blankS}</div><div class="qsub">${esc(w.sk)}</div>`;
    const opts=shuffle([w.w,...distractors(w,"w")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }else{ // type
    h=`<div class="qtype">✍️ 직접 입력</div><div class="qmain">${blankS}</div><div class="qsub">${esc(w.sk)}<br>힌트: <b>${w.w[0]}</b>${"_ ".repeat(w.w.length-1)} (${w.ko})</div>
    <input class="type" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력"><button class="btn pri" id="tgo">확인</button>`;
  }
  $("qBody").innerHTML=h;
  if(type==="listen"){$("play").onclick=()=>speak(w.s);speak(w.s)}
  $("qBody").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v,ans=type==="meaning"?w.ko:w.w,ok=v===ans;
    $("qBody").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===ans)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    grade(ok);
  });
  if(type==="type"){
    const go=()=>{const i=$("tin");if(i.disabled)return;const ok=i.value.trim().toLowerCase()===w.w.toLowerCase();i.disabled=true;i.classList.add(ok?"right":"wrong");$("tgo").style.display="none";grade(ok)};
    $("tgo").onclick=go;$("tin").onkeydown=e=>{if(e.key==="Enter")go()};
    setTimeout(()=>$("tin").focus(),50);
  }
}

function grade(ok){
  const {w}=Q[qi];
  if(mode==="test"){S.recent.push({lv:w.lv,ok});}
  else{
    let c=card(w)||{box:0,due:0,r:0,x:0};
    if(ok){c.box=Math.min(5,c.box+1);c.r++;c.due=Date.now()+INTV[c.box]*DAY}
    else{c.box=0;c.x++;c.due=Date.now();if(!Q.slice(qi+1).some(q=>q.w===w))Q.push({w,type:"meaning"})}
    S.cards[w.id]=c;
    if(ok){combo++;right++;const g=10+(combo>=3?5:0);S.xp+=g;sessXP+=g}else combo=0;
    S.done++;
    S.recent.push({lv:w.lv,ok});S.recent=S.recent.slice(-20);
    adjustLevel();
    save();
  }
  if(mode==="test"&&ok)right++;
  $("fb").className="fb show "+(ok?"ok":"no");
  $("fbH").textContent=ok?(combo>=3?`정답! 🔥 ${combo}연속`:"정답!"):"아쉬워요";
  $("fbS").innerHTML=`<b>${esc(w.w)}</b> · ${esc(w.ko)}<br>${esc(w.s)}`;
  $("fbK").textContent=w.sk;
  if(mode!=="test")speak(w.s);
}
function adjustLevel(){
  const r=S.recent.filter(x=>x.lv>=(S.level||1));
  if(S.recent.length<20||r.length<8)return;
  const acc=r.filter(x=>x.ok).length/r.length;
  if(acc>=.85&&S.level<5){S.level++;S.recent=[];toastLv="⬆️ 레벨 업! Lv."+S.level}
  else if(acc<.5&&S.level>1){S.level--;S.recent=[]}
}
let toastLv="";
$("fbNext").onclick=()=>{
  $("fb").className="fb";
  qi++;
  if(qi<Q.length){renderQ();return}
  finish();
};
function finish(){
  $("qBar").style.width="100%";
  if(mode==="test"){
    // level = highest level where you got at least one of its words right, counting up while not 0
    let lv=1;for(let l=1;l<=5;l++){const g=S.recent.filter(x=>x.lv===l);if(g.some(x=>x.ok))lv=l;else break}
    S.level=lv;S.recent=[];save();
    $("rEmoji").textContent="🛫";$("rTitle").textContent="당신의 레벨: Lv."+lv;
    $("rTxt").textContent="10문제 중 "+right+"개 정답. 이 레벨부터 시작하고, 실력에 맞춰 자동으로 올라가거나 내려가요.";
    $("rAgain").textContent="학습 시작";$("rAgain").onclick=()=>buildSession("learn");
  }else{
    if(S.lastDay!==today()){S.streak=S.lastDay===new Date(Date.now()-DAY).toDateString()?S.streak+1:1;S.lastDay=today()}
    save();
    const total=Q.length,pct=Math.round(right/total*100);
    $("rEmoji").textContent=pct>=90?"🏆":pct>=60?"🎉":"💪";
    $("rTitle").textContent=toastLv||"세트 완료!";toastLv="";
    $("rTxt").innerHTML=`정답 ${right} / ${total} (${pct}%)<br>+${sessXP} XP · 🔥 ${S.streak}일 연속<br>틀린 단어는 곧 복습에 다시 나와요.`;
    $("rAgain").textContent="한 세트 더";$("rAgain").onclick=()=>buildSession(mode==="review"?"learn":mode);
  }
  show("result");
}
$("qx").onclick=()=>{$("fb").className="fb";if(mode==="test"&&!S.level){show("intro");return}renderHome()};
$("rHome").onclick=renderHome;
$("bLearn").onclick=()=>buildSession("learn");
$("bReview").onclick=()=>buildSession("review");
$("bListen").onclick=()=>buildSession("listen");
$("bTest").onclick=()=>{S.recent=[];buildSession("test")};
$("bRetest").onclick=e=>{e.preventDefault();S.recent=[];buildSession("test")};

// ===== WORDBOOK =====
let bf="all";
function renderBook(){
  let list=W.filter(w=>card(w));
  if(bf==="weak")list=list.filter(w=>card(w).box<=1);
  if(bf==="master")list=list.filter(w=>card(w).box>=4);
  list.sort((a,b)=>card(a).box-card(b).box);
  $("wl").innerHTML=list.length?list.map(w=>{const c=card(w);return `<div class="wi" data-say="${esc(w.w)}"><div><b>${esc(w.w)}</b> <small>${esc(w.ko)} · ${{av:"항공",gen:"단어",ex:"회화"}[w.c]} Lv.${w.lv}</small></div><span class="dots">${"●".repeat(c.box)}${"○".repeat(5-c.box)}</span></div>`}).join(""):`<p class="muted" style="text-align:center;padding:40px 0">아직 단어가 없어요.</p>`;
  show("book");
}
$("bBook").onclick=renderBook;$("bx").onclick=renderHome;
$("bookSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;bf=b.dataset.b;$("bookSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderBook()};

document.addEventListener("click",e=>{const t=e.target.closest("[data-say]");if(t)speak(t.dataset.say)});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
// ===== START =====
if(!S.level)show("intro");else renderHome();
</script>
