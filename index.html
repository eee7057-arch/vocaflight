<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocaFlight</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VocaFlight">
<meta name="theme-color" content="#f4f7fb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#0ea5e9;--pri2:#0369a1;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{font-size:26px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.stats{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 3px #0001}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.goal{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#22d3ee);border-radius:99px;transition:width .3s}
.btn{font:inherit;font-weight:700;font-size:17px;border:none;border-radius:16px;padding:17px;cursor:pointer;width:100%}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri2)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4}
.menu{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:none;background:none;padding:9px;border-radius:9px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.badge{font-size:12px;font-weight:700;background:#e0f2fe;color:var(--pri2);padding:4px 10px;border-radius:99px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{font-size:24px;background:none;border:none;color:var(--sub);cursor:pointer;padding:4px}
.qtop .bar{flex:1;margin:0}
.combo{font-weight:800;color:var(--gold);font-size:14px;min-width:44px;text-align:right}
.qtype{font-size:13px;font-weight:700;color:var(--pri2);margin-bottom:10px}
.qmain{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:8px;word-break:keep-all}
.qmain .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--pri);color:var(--pri);text-align:center}
.qsub{font-size:16px;color:var(--sub);line-height:1.5;margin-bottom:22px}
.qword{font-size:40px;font-weight:800;text-align:center;margin:30px 0 8px}
.spk{font:inherit;border:none;background:#e0f2fe;color:var(--pri2);border-radius:99px;padding:10px 16px;font-weight:700;cursor:pointer;margin-bottom:18px;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:18px;font-weight:600;text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.opt.right{border-color:var(--ok);background:#dcfce7}
.opt.wrong{border-color:var(--bad);background:#fee2e2}
input.type{font:inherit;font-size:22px;padding:16px;border-radius:14px;border:2px solid var(--line);width:100%;outline:none;margin-bottom:12px;background:#fff}
input.type:focus{border-color:var(--pri)}
input.type.right{border-color:var(--ok);background:#dcfce7}
input.type.wrong{border-color:var(--bad);background:#fee2e2}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s;z-index:5}
.fb.show{transform:none}
.fb.ok{background:#dcfce7}.fb.no{background:#fee2e2}
.fb .in{max-width:444px;margin:0 auto}
.fb h3{font-size:20px;margin-bottom:6px}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb p{font-size:15px;line-height:1.5;margin-bottom:4px}
.fb .k{color:var(--sub);margin-bottom:14px}
.fb.ok .btn{background:var(--ok);box-shadow:0 4px 0 #15803d;color:#fff}
.fb.no .btn{background:var(--bad);box-shadow:0 4px 0 #991b1b;color:#fff}
/* result */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.big{font-size:56px}
/* wordbook */
.wl{display:flex;flex-direction:column;gap:8px;overflow:auto}
.wi{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wi b{font-size:16px}.wi small{color:var(--sub);font-size:13px;display:block}
.dots{letter-spacing:2px;color:var(--pri);font-size:12px;white-space:nowrap}
.muted{color:var(--sub);font-size:14px;line-height:1.5}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.sheet.on{display:block}
.sheet .in{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
.emo{font-size:72px;text-align:center;line-height:1.1;margin:6px 0 4px}
.dw{font-size:32px;font-weight:800;text-align:center;word-break:keep-all}
.dpos{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 2px}
.dko{text-align:center;font-size:20px;font-weight:700;margin:6px 0 16px}
.box{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.box h4{font-size:13px;color:var(--pri2);margin-bottom:8px}
.box p{font-size:16px;line-height:1.6}
.exi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.exi:first-of-type{border-top:none;padding-top:0}
.exi .t{flex:1;font-size:16px;line-height:1.5}
.exi .t small{display:block;color:var(--sub);font-size:14px}
.exi.hide{display:none}
.mini{font:inherit;font-size:14px;font-weight:700;border:none;background:#e0f2fe;color:var(--pri2);border-radius:99px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.moreEx{margin-top:10px;width:100%}
textarea.mk{font:inherit;font-size:17px;width:100%;min-height:80px;padding:12px;border-radius:12px;border:2px solid var(--line);outline:none;resize:vertical;background:#fff}
textarea.mk:focus{border-color:var(--pri)}
.mkmsg{font-size:14px;margin:8px 0;line-height:1.5}
.mine{font-size:15px;padding:8px 0;border-top:1px dashed var(--line);line-height:1.5}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:14px;margin-bottom:12px}
.tiles.ans{background:#fff;border:2px dashed var(--line)}
.tile{font:inherit;font-size:17px;font-weight:600;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tiles.ans .tile{border-color:var(--pri)}
.fbrow{display:flex;gap:10px}
.fbrow .btn{flex:1}
.fb .btn.ghost{background:#fff!important;color:var(--ink)!important;box-shadow:0 4px 0 var(--line)!important;flex:0 0 auto;width:auto;padding:17px 18px}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section class="screen" id="home">
  <div class="row" style="justify-content:space-between">
    <h1>VocaFlight ✈️</h1>
    <span class="badge" id="lvBadge">Lv.1</span>
  </div>
  <div class="stats">
    <div class="stat"><b id="sStreak">0</b><span>🔥 연속 학습일</span></div>
    <div class="stat"><b id="sXP">0</b><span>⭐ 오늘 XP</span></div>
    <div class="stat"><b id="sLearned">0</b><span>📚 학습 단어</span></div>
  </div>
  <div class="goal">
    <div class="row" style="justify-content:space-between"><b>오늘의 목표</b><span class="muted" id="goalTxt">0 / 30문제</span></div>
    <div class="bar"><i id="goalBar" style="width:0"></i></div>
  </div>
  <div class="seg" id="course">
    <button data-c="mix" class="on">섞기</button>
    <button data-c="av">✈️ 항공</button>
    <button data-c="gen">📚 단어</button>
    <button data-c="ex">💬 회화</button>
  </div>
  <div class="menu">
    <button class="btn pri" id="bLearn">학습 시작 (10문제)</button>
    <button class="btn sec" id="bReview">복습하기</button>
    <button class="btn sec" id="bListen">🎧 듣기 퀴즈</button>
    <button class="btn sec" id="bBook">📖 단어장</button>
  </div>
  <p class="muted" style="margin-top:auto;padding-top:20px;text-align:center"><a href="#" id="bRetest" style="color:var(--sub)">레벨 테스트 다시 하기</a></p>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <div class="qtop">
    <button class="x" id="qx">✕</button>
    <div class="bar"><i id="qBar"></i></div>
    <span class="combo" id="combo"></span>
  </div>
  <div id="qBody" style="display:flex;flex-direction:column"></div>
</section>

<!-- RESULT -->
<section class="screen" id="result">
  <div class="center">
    <div class="big" id="rEmoji">🎉</div>
    <h1 id="rTitle">학습 완료!</h1>
    <p class="muted" id="rTxt"></p>
  </div>
  <div class="menu">
    <button class="btn pri" id="rAgain">한 세트 더</button>
    <button class="btn sec" id="rHome">홈으로</button>
  </div>
</section>

<!-- WORDBOOK -->
<section class="screen" id="book">
  <div class="qtop"><button class="x" id="bx">✕</button><h1 style="font-size:20px">단어장</h1></div>
  <div class="seg" id="bookSeg">
    <button data-b="all" class="on">전체</button>
    <button data-b="weak">약한 단어</button>
    <button data-b="master">마스터</button>
  </div>
  <div class="wl" id="wl"></div>
</section>

<!-- LEVEL TEST INTRO -->
<section class="screen" id="intro">
  <div class="center">
    <div class="big">✈️</div>
    <h1>VocaFlight</h1>
    <p class="muted">먼저 10문제로 레벨을 확인할게요.<br>모르면 찍지 말고 "모르겠어요"를 눌러주세요.</p>
  </div>
  <button class="btn pri" id="bTest">레벨 테스트 시작</button>
</section>

</div>

<div class="fb" id="fb"><div class="in">
  <h3 id="fbH"></h3><p id="fbS"></p><p class="k" id="fbK"></p>
  <div class="fbrow"><button class="btn ghost" id="fbMore">📖 자세히</button><button class="btn" id="fbNext">계속</button></div>
</div></div>
<div class="sheet" id="detail"><div class="in" id="dIn"></div></div>

<script>
// ===== WORD BANK =====  w, pos, ko, s(sentence containing w), sk, lv(1-5), c(gen/av)
const W=[
// general L1
["decide","v","결정하다","I can't decide what to eat.","뭘 먹을지 못 정하겠어.",1,"gen"],
["borrow","v","빌리다","Can I borrow your pen?","펜 좀 빌려도 돼?",1,"gen"],
["arrive","v","도착하다","What time does the bus arrive?","버스 몇 시에 도착해?",1,"gen"],
["expensive","adj","비싼","This phone is too expensive.","이 폰은 너무 비싸.",1,"gen"],
["quiet","adj","조용한","The library is very quiet.","도서관은 아주 조용해.",1,"gen"],
["hungry","adj","배고픈","I'm so hungry. Let's eat.","너무 배고파. 밥 먹자.",1,"gen"],
["forget","v","잊다","Don't forget your keys.","열쇠 잊지 마.",1,"gen"],
["early","adv","일찍","I woke up early today.","오늘 일찍 일어났어.",1,"gen"],
["explain","v","설명하다","Can you explain this word?","이 단어 설명해 줄 수 있어?",1,"gen"],
["weather","n","날씨","The weather is nice today.","오늘 날씨 좋다.",1,"gen"],
// L2
["improve","v","향상시키다","I want to improve my English.","영어 실력을 늘리고 싶어.",2,"gen"],
["prepare","v","준비하다","I need to prepare for the test.","시험 준비해야 돼.",2,"gen"],
["available","adj","시간이 되는, 이용 가능한","Are you available tomorrow?","내일 시간 돼?",2,"gen"],
["schedule","n","일정","My schedule is full this week.","이번 주 일정이 꽉 찼어.",2,"gen"],
["recommend","v","추천하다","Can you recommend a good movie?","좋은 영화 추천해 줄래?",2,"gen"],
["complain","v","불평하다","Please don't complain about the food.","음식에 대해 불평하지 마.",2,"gen"],
["convenient","adj","편리한","Online classes are convenient.","온라인 수업은 편해.",2,"gen"],
["mention","v","언급하다","She didn't mention the test.","그녀는 시험 얘기를 안 했어.",2,"gen"],
["nervous","adj","긴장한","I get nervous before speeches.","발표 전에 긴장돼.",2,"gen"],
["suddenly","adv","갑자기","Suddenly, the lights went out.","갑자기 불이 꺼졌다.",2,"gen"],
// L3
["reluctant","adj","꺼리는, 내키지 않는","He was reluctant to ask for help.","그는 도움을 요청하길 꺼렸다.",3,"gen"],
["thorough","adj","철저한, 꼼꼼한","The doctor did a thorough check.","의사가 꼼꼼하게 검사했다.",3,"gen"],
["anticipate","v","예상하다","We didn't anticipate so much traffic.","차가 이렇게 막힐 줄 몰랐다.",3,"gen"],
["deteriorate","v","악화되다","The situation began to deteriorate.","상황이 나빠지기 시작했다.",3,"gen"],
["mitigate","v","완화하다, 줄이다","Trees can mitigate noise.","나무는 소음을 줄일 수 있다.",3,"gen"],
["efficient","adj","효율적인","This is an efficient way to study.","이건 효율적인 공부법이야.",3,"gen"],
["assume","v","추측하다, 가정하다","Don't assume he knows.","그가 알 거라고 넘겨짚지 마.",3,"gen"],
["consistent","adj","꾸준한, 일관된","Try to be consistent with your study.","공부를 꾸준히 하도록 해.",3,"gen"],
["eventually","adv","결국","Eventually, I found my wallet.","결국 지갑을 찾았다.",3,"gen"],
["procrastinate","v","미루다","I procrastinate when I'm tired.","피곤하면 일을 미뤄.",3,"gen"],
// L4
["ambiguous","adj","애매모호한","The question was ambiguous.","질문이 애매했다.",4,"gen"],
["inevitable","adj","피할 수 없는","Mistakes are inevitable when you learn.","배울 때 실수는 피할 수 없다.",4,"gen"],
["meticulous","adj","세심한, 꼼꼼한","She is meticulous about details.","그녀는 세부 사항에 아주 세심하다.",4,"gen"],
["undermine","v","약화시키다","Lack of sleep can undermine your focus.","수면 부족은 집중력을 떨어뜨린다.",4,"gen"],
["elaborate","v","자세히 설명하다","Could you elaborate on that point?","그 부분 좀 더 자세히 말해 줄래요?",4,"gen"],
["plausible","adj","그럴듯한","That's a plausible explanation.","그럴듯한 설명이네.",4,"gen"],
["compelling","adj","설득력 있는","She made a compelling argument.","그녀는 설득력 있는 주장을 했다.",4,"gen"],
["substantial","adj","상당한","There was a substantial increase in price.","가격이 상당히 올랐다.",4,"gen"],
["deliberately","adv","일부러","He deliberately ignored the message.","그는 일부러 메시지를 무시했다.",4,"gen"],
["scrutinize","v","면밀히 살펴보다","Investors scrutinize every report.","투자자들은 모든 보고서를 꼼꼼히 살핀다.",4,"gen"],
// L5
["ubiquitous","adj","어디에나 있는","Smartphones are ubiquitous today.","요즘 스마트폰은 어디에나 있다.",5,"gen"],
["exacerbate","v","악화시키다","Stress can exacerbate the problem.","스트레스는 문제를 더 악화시킬 수 있다.",5,"gen"],
["pragmatic","adj","실용적인","We need a pragmatic solution.","실용적인 해결책이 필요해.",5,"gen"],
["alleviate","v","덜어 주다","This medicine will alleviate the pain.","이 약이 통증을 덜어 줄 거야.",5,"gen"],
["candid","adj","솔직한","Thanks for your candid feedback.","솔직한 피드백 고마워.",5,"gen"],
["complacent","adj","현실에 안주하는","Don't become complacent after one success.","한 번 성공했다고 안주하지 마.",5,"gen"],
["diligent","adj","성실한","She is a diligent student.","그녀는 성실한 학생이다.",5,"gen"],
["tentative","adj","잠정적인","We made a tentative plan.","우리는 잠정적인 계획을 세웠다.",5,"gen"],
["nonetheless","adv","그럼에도 불구하고","It was raining. Nonetheless, we went out.","비가 왔다. 그래도 우리는 나갔다.",5,"gen"],
["circumvent","v","피해 가다, 우회하다","They tried to circumvent the rules.","그들은 규칙을 피해 가려 했다.",5,"gen"],
// aviation L1
["runway","n","활주로","The plane is landing on the runway.","비행기가 활주로에 착륙하고 있다.",1,"av"],
["altitude","n","고도","We are climbing to a higher altitude.","더 높은 고도로 상승 중이다.",1,"av"],
["takeoff","n","이륙","The takeoff was smooth.","이륙이 부드러웠다.",1,"av"],
["cockpit","n","조종석","The captain is in the cockpit.","기장은 조종석에 있다.",1,"av"],
["fuel","n","연료","Check the fuel before every flight.","매 비행 전 연료를 확인해라.",1,"av"],
["passenger","n","승객","Every passenger must wear a seatbelt.","모든 승객은 안전벨트를 매야 한다.",1,"av"],
// L2
["taxi","v","(비행기가) 지상 이동하다","Taxi to runway 27 via Alpha.","Alpha 유도로로 27번 활주로까지 이동하라.",2,"av"],
["clearance","n","(관제) 허가","We received our takeoff clearance.","이륙 허가를 받았다.",2,"av"],
["heading","n","기수 방향","Turn left, fly heading 270.","좌선회, 방위 270으로 비행하라.",2,"av"],
["visibility","n","시정 (보이는 거리)","Visibility is less than one mile.","시정이 1마일 미만이다.",2,"av"],
["tower","n","관제탑","Contact the tower on 118.3.","118.3에서 관제탑과 교신하라.",2,"av"],
["descend","v","하강하다","Descend and maintain 3,000 feet.","하강하여 3,000피트를 유지하라.",2,"av"],
// L3
["turbulence","n","난기류","Expect turbulence over the mountains.","산 위에서 난기류가 예상된다.",3,"av"],
["maintain","v","유지하다","Climb and maintain 5,000.","상승하여 5,000을 유지하라.",3,"av"],

"meticulous":["🧵","아주 작은 부분까지 신경 쓰는. thorough보다 더 세밀한 느낌.",[["He keeps meticulous notes.","그는 아주 꼼꼼하게 노트를 쓴다."],["Mechanics must be meticulous.","정비사는 세심해야 한다."]]],
"undermine":["🕳️","아래를 파서 무너뜨리듯 무언가를 서서히 약하게 만들다. 자신감, 신뢰, 노력 등에 써요.",[["Rumors can undermine trust.","소문은 신뢰를 무너뜨릴 수 있다."],["Don't let one mistake undermine your confidence.","실수 하나로 자신감을 잃지 마."]]],
"elaborate":["🗣️","동사로는 '더 자세히 설명하다'. elaborate on + 주제. 형용사로는 '정교한'.",[["Can you elaborate a little more?","조금 더 자세히 말해 줄래요?"],["She elaborated on her plan.","그녀는 계획을 자세히 설명했다."]]],
"plausible":["🧩","진짜일 수도 있겠다 싶은, 그럴듯한. 사실이라는 확신은 없어요.",[["His excuse sounded plausible.","그의 변명은 그럴듯하게 들렸다."],["Is there a more plausible reason?","더 그럴듯한 이유가 있을까?"]]],
"compelling":["🧲","끌어당기듯 설득력 있거나 흥미로운. 이야기, 증거, 이유에 자주 써요.",[["The movie has a compelling story.","그 영화는 이야기가 흡입력 있다."],["There is compelling evidence for this.","이에 대한 설득력 있는 증거가 있다."]]],
"substantial":["🏋️","양이나 크기가 꽤 큰, 무시할 수 없는.",[["She received a substantial scholarship.","그녀는 상당한 장학금을 받았다."],["We made substantial progress.","우리는 상당한 진전을 이뤘다."]]],
"deliberately":["🎯","실수가 아니라 일부러, 의도적으로. '신중하게 천천히'라는 뜻도 있어요.",[["She deliberately left early.","그녀는 일부러 일찍 나갔다."],["He spoke slowly and deliberately.","그는 천천히 신중하게 말했다."]]],
"scrutinize":["🔬","아주 자세히 뜯어보며 검사하다. look at보다 훨씬 강한 느낌.",[["The teacher scrutinized my essay.","선생님이 내 에세이를 꼼꼼히 살폈다."],["Pilots scrutinize the weather before a long flight.","조종사는 장거리 비행 전 날씨를 꼼꼼히 살핀다."]]],
"ubiquitous":["🌐","어디를 가도 있는, 아주 흔한. everywhere의 고급 표현.",[["Coffee shops are ubiquitous in Seattle.","시애틀엔 커피숍이 어디에나 있다."],["Short videos are ubiquitous on social media.","짧은 영상은 SNS 어디에나 있다."]]],
"exacerbate":["🔥","이미 나쁜 상황을 더 나쁘게 만들다. make worse의 고급 표현.",[["Lack of sleep exacerbates stress.","수면 부족은 스트레스를 악화시킨다."],["The rain exacerbated the traffic.","비가 교통 체증을 더 심하게 했다."]]],
"pragmatic":["🔧","이상보다 현실적으로 실제 되는 방법을 고르는.",[["She is a pragmatic leader.","그녀는 현실적인 리더다."],["Let's take a pragmatic approach.","현실적인 방법으로 가자."]]],
"alleviate":["🩹","고통, 걱정, 문제를 덜어 주다, 가볍게 하다.",[["Exercise can alleviate stress.","운동은 스트레스를 덜어 줄 수 있다."],["The new road will alleviate traffic.","새 도로가 교통 체증을 줄여 줄 것이다."]]],
"candid":["🗨️","숨김없이 솔직한. honest와 비슷하지만 '불편한 것도 털어놓는' 느낌.",[["Can I be candid with you?","솔직하게 말해도 될까?"],["He gave a candid interview.","그는 솔직한 인터뷰를 했다."]]],
"complacent":["😴","지금 잘하고 있다고 생각해서 방심하고 노력하지 않는. 항공 안전에서 큰 위험 요소로 자주 나와요.",[["Experienced pilots can become complacent.","경험 많은 조종사도 방심할 수 있다."],["We won, but we can't get complacent.","이겼지만 방심하면 안 된다."]]],
"diligent":["🐜","꾸준히 열심히, 성실하게 하는.",[["He is diligent about his homework.","그는 숙제를 성실히 한다."],["Diligent study pays off.","성실한 공부는 보상을 받는다."]]],
"tentative":["✏️","아직 확정되지 않은, 바뀔 수 있는. 연필로 적어 둔 계획 느낌.",[["Our tentative date is June 5.","잠정 날짜는 6월 5일이다."],["She gave a tentative smile.","그녀는 조심스럽게 웃었다."]]],
"nonetheless":["↪️","앞에서 말한 것에도 불구하고. however와 비슷하지만 더 격식 있는 느낌.",[["The test was hard. Nonetheless, I passed.","시험은 어려웠다. 그래도 통과했다."],["It's expensive, but it's worth it nonetheless.","비싸지만 그래도 그만한 가치가 있다."]]],
"circumvent":["🔀","규칙이나 문제를 정면으로 해결하지 않고 돌아서 피하다. 보통 부정적인 느낌.",[["He tried to circumvent the security check.","그는 보안 검사를 피해 가려고 했다."],["We found a way to circumvent the problem.","우리는 그 문제를 우회할 방법을 찾았다."]]],
"runway":["🛣️","비행기가 이륙하고 착륙하는 긴 포장 도로. 번호는 자기 방위 ÷ 10 (27 = 270°).",[["The runway is wet after the rain.","비가 온 뒤라 활주로가 젖어 있다."],["Runway 34 is closed today.","34번 활주로는 오늘 폐쇄됐다."]]],
"altitude":["🏔️","보통 평균 해수면(MSL) 기준 높이. 지면 기준 높이는 height 또는 AGL.",[["We are cruising at 35,000 feet.","우리는 35,000피트에서 순항 중이다."],["Check your altitude.","고도를 확인해라."]]],
"takeoff":["🛫","명사: 이륙. 동사로 쓸 때는 두 단어로 take off.",[["We will take off in five minutes.","5분 후에 이륙합니다."],["Takeoff is a busy part of the flight.","이륙은 비행에서 바쁜 순간이다."]]],
"cockpit":["🧑‍✈️","조종사가 앉아서 비행기를 조종하는 공간. flight deck이라고도 해요.",[["Only pilots are allowed in the cockpit.","조종실엔 조종사만 들어갈 수 있다."],["The cockpit has many instruments.","조종석엔 계기가 많다."]]],
"fuel":["⛽","비행기를 움직이는 연료. 소형기는 avgas, 제트기는 jet fuel. 동사로 '연료를 넣다'도 돼요.",[["We need to fuel the plane.","비행기에 연료를 넣어야 한다."],["Never take off with low fuel.","연료가 부족한 상태로 절대 이륙하지 마라."]]],
"passenger":["🧳","비행기, 차 등에 타고 있는 승객 (조종사, 승무원 제외).",[["The flight had 180 passengers.","그 비행편엔 승객 180명이 탔다."],["Brief your passengers before the flight.","비행 전에 승객에게 안내해라."]]],
"taxi":["🚕","비행기가 자기 힘으로 지상에서 이동하는 것. 택시와 철자가 같아요.",[["We taxied to the gate after landing.","착륙 후 게이트로 이동했다."],["Taxi slowly on wet surfaces.","젖은 노면에서는 천천히 이동해라."]]],
"clearance":["✅","관제(ATC)가 주는 허가. takeoff clearance, landing clearance, IFR clearance 등.",[["Read back your clearance.","허가를 복창해라."],["We are waiting for our IFR clearance.","IFR 허가를 기다리는 중이다."]]],
"heading":["🧭","비행기 기수가 가리키는 방향(도). 실제로 가는 경로(track)와는 바람 때문에 다를 수 있어요.",[["Turn right heading 090.","우선회, 방위 090."],["Maintain your heading.","기수 방향을 유지해라."]]],
"visibility":["👀","앞을 얼마나 멀리 볼 수 있는지. 미국은 statute miles(SM)로 표시해요.",[["Fog reduced the visibility.","안개 때문에 시정이 줄었다."],["VFR flight needs good visibility.","시계 비행에는 좋은 시정이 필요하다."]]],
"tower":["🗼","공항 주변 이착륙을 관리하는 관제탑. 무선에서 '공항 이름 + Tower'로 불러요.",[["Boeing Tower, N123AB, ready for departure.","보잉 타워, N123AB 이륙 준비 완료."],["The tower cleared us to land.","관제탑이 착륙을 허가했다."]]],
"descend":["⬇️","고도를 낮추다. 반대말 climb. 명사는 descent.",[["We will descend shortly.","곧 하강합니다."],["Start your descent now.","지금 하강을 시작해라."]]],
"turbulence":["🌪️","공기 흐름이 불규칙해서 비행기가 흔들리는 것. 셀 수 없는 명사예요.",[["Please fasten your seatbelt due to turbulence.","난기류로 인해 안전벨트를 매 주세요."],["We hit some light turbulence.","약한 난기류를 만났다."]]],
"maintain":["📏","현재 상태(고도, 속도, 방향)를 그대로 유지하다. ATC 지시에서 정말 자주 나와요.",[["Maintain 2,000 until established.","진입할 때까지 2,000을 유지하라."],["Maintain a safe speed.","안전한 속도를 유지해라."]]],
"crosswind":["↔️","활주로 방향과 옆으로 엇갈려 부는 바람. 착륙을 어렵게 만들어요.",[["The crosswind was 15 knots.","측풍이 15노트였다."],["We practiced crosswind landings today.","오늘 측풍 착륙을 연습했다."]]],
"inspection":["🔧","문제가 없는지 자세히 살펴보는 점검. 비행 전 점검은 preflight inspection.",[["The annual inspection is due next month.","연간 점검이 다음 달이다."],["The inspection found a small crack.","점검에서 작은 균열이 발견됐다."]]],
"divert":["↪️","원래 목적지가 아닌 다른 곳으로 방향을 바꾸다. 날씨나 비상 상황 때.",[["The flight diverted because of fog.","안개 때문에 다른 공항으로 회항했다."],["We may divert to Portland.","포틀랜드로 회항할 수도 있다."]]],
"readback":["🔁","관제 지시를 조종사가 그대로 다시 말하는 것. 실수를 막기 위해 필수예요.",[["Your readback is correct.","복창이 맞습니다."],["Always read back hold short instructions.","Hold short 지시는 항상 복창해라."]]],
"ceiling":["☁️","가장 낮은 BKN(broken) 또는 OVC(overcast) 구름층의 높이. 일반적인 뜻은 '천장'.",[["The ceiling is too low for VFR.","운고가 시계 비행 하기엔 너무 낮다."],["Ceilings will rise in the afternoon.","오후엔 운고가 높아질 것이다."]]],
"deviation":["↗️","원래 경로나 고도에서 벗어나는 것. 날씨를 피할 때 요청해요.",[["Deviation approved, return to course when able.","이탈 승인, 가능할 때 원래 경로로 복귀하라."],["Report any deviation from your clearance.","허가와 다르게 비행하면 보고해라."]]],
"fatigue":["🥱","쌓인 피로. tired보다 심각하고 판단력을 떨어뜨리는 상태. 항공 안전 핵심 용어예요.",[["Fatigue slows your reaction time.","피로는 반응 속도를 늦춘다."],["Don't fly if you feel fatigue.","피로를 느끼면 비행하지 마라."]]],
"squawk":["📟","트랜스폰더에 4자리 코드를 넣다. ATC가 'Squawk 4521'처럼 지시해요.",[["Squawk 1200 for VFR.","VFR은 1200을 설정해라."],["Squawk ident.","식별 버튼을 눌러라."]]],
"precipitation":["🌧️","비, 눈, 진눈깨비처럼 하늘에서 떨어지는 모든 것.",[["Heavy precipitation is expected tonight.","오늘 밤 많은 강수가 예상된다."],["Precipitation can reduce visibility.","강수는 시정을 낮출 수 있다."]]],
"approach":["🛬","착륙하려고 활주로로 다가가는 비행 단계. 동사로는 '다가가다'.",[["We are on final approach.","최종 접근 중이다."],["Request the visual approach.","시계 접근을 요청한다."]]],
"airworthy":["🛠️","항공기가 규정에 맞고 안전하게 비행할 수 있는 상태인. 확인 책임은 기장(PIC)에게 있어요.",[["Is the aircraft airworthy?","그 항공기는 감항성이 있나?"],["A broken light can make the plane unairworthy.","고장 난 등 하나로도 감항성을 잃을 수 있다."]]],
"icing":["🧊","비행 중 날개나 기체에 얼음이 붙는 것. 양력이 줄고 무게가 늘어서 매우 위험해요.",[["We climbed to get out of icing.","착빙을 벗어나려고 상승했다."],["Watch for carburetor icing.","기화기 결빙을 조심해라."]]],
"expedite":["⏩","평소보다 빠르게 하다. ATC가 '서둘러 달라'고 할 때 써요.",[["Expedite taxi across the runway.","활주로를 빠르게 건너가라."],["Can you expedite your descent?","하강을 서둘러 줄 수 있나?"]]],
"vectors":["📡","관제사가 레이더를 보고 주는 방향(heading) 지시들.",[["Fly heading 180, vectors to the ILS.","방위 180으로 비행, ILS로 유도한다."],["We received vectors around the storm.","폭풍을 피하도록 유도를 받았다."]]],
"stall":["📉","날개의 받음각이 너무 커져서 양력을 잃는 상태. 엔진이 꺼지는 게 아니에요!",[["The stall warning horn went off.","실속 경고음이 울렸다."],["Lower the nose to recover from a stall.","기수를 낮춰서 실속에서 회복해라."]]],
"incapacitation":["🚑","조종사가 갑자기 몸이 안 좋아져서 비행기를 조종할 수 없게 되는 상태.",[["The first officer took control after the captain's incapacitation.","기장이 조종 불능이 되자 부기장이 조종을 넘겨받았다."],["Crews train for pilot incapacitation.","승무원은 조종사 무능력화 상황을 훈련한다."]]],
"No worries":["😌","상대가 사과하거나 고마워할 때 '괜찮아'라고 가볍게 하는 말. No problem과 비슷해요.",[["Thanks for your help! No worries.","도와줘서 고마워! 별거 아냐."],["I forgot your book. No worries, bring it tomorrow.","책 깜빡했어. 괜찮아, 내일 가져와."]]],
"I'm running late":["🏃","약속에 늦을 것 같을 때 미리 알리는 표현. 문자로 많이 보내요.",[["I'm running late for class.","수업에 늦을 것 같아."],["The bus is slow. I'm running late.","버스가 느려. 나 늦을 듯."]]],
"Fair enough":["🤝","상대 말이 이해되거나 일리 있을 때 '그럴 만하네, 인정'.",[["I want to rest today. Fair enough.","오늘은 쉬고 싶어. 그럴 만하지."],["Fair enough, you can choose next time.","인정, 다음엔 네가 골라."]]],
"Sounds good":["👌","제안에 동의할 때 '좋아'. 문자에서 정말 자주 써요.",[["Let's meet at the library. Sounds good.","도서관에서 만나자. 좋아."],["Sounds good to me.","난 좋아."]]],
"Never mind":["🙃","방금 한 말을 취소하거나 '신경 쓰지 마' 할 때.",[["What did you say? Never mind, it's not important.","뭐라고? 됐어, 중요한 거 아냐."],["Never mind, I'll do it myself.","됐어, 내가 할게."]]],
"I'm good":["🙅‍♂️","뭔가 권할 때 '난 괜찮아(필요 없어)'라고 정중하게 거절하는 말. 안부 대답으로도 써요.",[["Do you need a bag? I'm good, thanks.","봉투 필요하세요? 괜찮아요."],["How are you? I'm good.","어떻게 지내? 잘 지내."]]],
"It slipped my mind":["💭","기억에서 미끄러져 나갔다 = 깜빡했다. I forgot보다 부드러워요.",[["Your birthday totally slipped my mind.","네 생일 완전 깜빡했어."],["Sorry, it slipped my mind to reply.","미안, 답장하는 걸 깜빡했어."]]],
"I'm on the fence":["🤸","울타리 위에 앉아서 어느 쪽으로도 안 내려간 상태 = 아직 결정 못 함.",[["I'm on the fence about buying it.","그거 살지 고민 중이야."],["I'm on the fence about the new job.","새 일자리 할지 고민 중이야."]]],
"Let me get back to you":["📞","지금 답을 못 줄 때 '확인하고 다시 연락할게'.",[["Let me get back to you after I check my schedule.","일정 확인하고 다시 연락할게."],["Can I get back to you on that?","그건 나중에 답해 줘도 될까?"]]],
"I'll pass":["✋","권유를 가볍게 거절할 때 '난 됐어'.",[["Another game? I'll pass, I'm tired.","한 판 더? 난 됐어, 피곤해."],["Thanks, but I'll pass this time.","고마운데 이번엔 패스할게."]]],

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rx=w=>new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
const inCourse=w=>course==="mix"||w.c===course;
const card=w=>S.cards[w.id];
function distractors(w,field,n=3){
  let p=W.filter(x=>x.id!==w.id&&x.pos===w.pos&&x.c===w.c&&Math.abs(x.lv-w.lv)<=1);
  if(p.length<n)p=W.filter(x=>x.id!==w.id&&x.pos===w.pos);
  if(p.length<n)p=W.filter(x=>x.id!==w.id);
  const seen=new Set([w[field]]);const out=[];
  for(const x of shuffle(p)){if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field])}if(out.length===n)break}
  return out;
}

let Q=[],qi=0,combo=0,right=0,mode="learn",sessXP=0;
function buildSession(m){
  mode=m;let words=[];
  if(m==="test"){
    for(let lv=1;lv<=5;lv++)words.push(...shuffle(W.filter(w=>w.lv===lv&&w.c==="gen")).slice(0,2));
    Q=words.map(w=>({w,type:"meaning"}));
  }else{
    const due=shuffle(dueList());
    if(m==="review")words=due.slice(0,10);
    else{
      words=due.slice(0,5);
      const lv=S.level||1;
      let fresh=shuffle(W.filter(w=>inCourse(w)&&!card(w)&&w.lv<=lv)).sort((a,b)=>b.lv-a.lv);
      if(fresh.length<10)fresh=fresh.concat(shuffle(W.filter(w=>inCourse(w)&&!card(w)&&w.lv>lv)).sort((a,b)=>a.lv-b.lv));
      words=words.concat(fresh.slice(0,10-words.length));
      if(words.length<10)words=words.concat(shuffle(W.filter(w=>inCourse(w)&&!words.includes(w))).slice(0,10-words.length));
    }
    Q=[];
    shuffle(words).forEach(w=>{
      if(m==="listen"){Q.push({w,type:"listen"});return}
      const b=card(w)?card(w).box:0;
      if(!card(w))Q.push({w,type:"intro"});
      const types=w.c==="ex"?(b===0?["meaning","reverse"]:b<3?["blank","reverse","listen","scramble"]:["reverse","scramble","make","listen"])
        :b===0?["meaning","blank"]:b<3?["blank","listen","type","scramble"]:["type","scramble","make","listen"];
      Q.push({w,type:types[Math.random()*types.length|0]});
    });
  }
  qi=0;combo=0;right=0;sessXP=0;
  if(!Q.length){renderHome();return}
  show("quiz");renderQ();
}

function renderQ(){
  const {w,type}=Q[qi];
  $("qBar").style.width=(qi/Q.length*100)+"%";
  $("combo").textContent=combo>=3?"🔥"+combo:"";
  const blankS=esc(w.s).replace(rx(w.w),'<span class="blank">?</span>');
  let h="";
  if(type==="intro"){
    $("qBody").innerHTML=`<div class="qtype">✨ 새 ${w.c==="ex"?"표현":"단어"}</div>${detailHTML(w,true)}<button class="btn pri" id="introGo" style="margin-top:6px">외웠어요, 문제 풀기 →</button>`;
    $("introGo").onclick=()=>{qi++;qi<Q.length?renderQ():finish()};
    speak(w.w);return;
  }
  if(type==="scramble"){
    const toks=w.s.split(" ");let pool=shuffle(toks);if(toks.length>2)while(pool.join(" ")===w.s)pool=shuffle(toks);
    let ans=[];
    h=`<div class="qtype">🧩 순서대로 눌러서 문장 만들기</div><div class="qsub" style="font-size:18px;color:var(--ink)">${esc(w.sk)}</div><div class="tiles ans" id="tA"></div><div class="tiles" id="tP"></div><button class="btn pri" id="tgo" disabled>확인</button>`;
    $("qBody").innerHTML=h;
    const draw=()=>{
      $("tA").innerHTML=ans.map((t,i)=>`<button class="tile" data-a="${i}">${esc(t)}</button>`).join("");
      $("tP").innerHTML=pool.map((t,i)=>`<button class="tile" data-p="${i}">${esc(t)}</button>`).join("");
      $("tgo").disabled=pool.length>0;
      $("tA").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if($("tgo").dataset.done)return;pool.push(ans.splice(+b.dataset.a,1)[0]);draw()});
      $("tP").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if($("tgo").dataset.done)return;ans.push(pool.splice(+b.dataset.p,1)[0]);draw()});
    };
    draw();
    $("tgo").onclick=()=>{$("tgo").dataset.done=1;const ok=ans.join(" ")===w.s;$("tA").style.borderColor=ok?"var(--ok)":"var(--bad)";$("tA").style.background=ok?"#dcfce7":"#fee2e2";$("tgo").style.display="none";grade(ok)};
    return;
  }
  if(type==="make"){
    h=`<div class="qtype">✍️ 이 ${w.c==="ex"?"표현":"단어"}로 나만의 예문 만들기</div><div class="qword" style="margin-top:6px;${w.w.length>14?"font-size:26px":""}">${w.e} ${esc(w.w)}</div><div class="qsub" style="text-align:center">${esc(w.ko)}</div>
    <div class="mkbox"><textarea class="mk" id="mkT" placeholder="예: ${esc(w.m[0]?w.m[0][0]:w.s)}" autocapitalize="sentences"></textarea><div class="mkmsg" id="mkM"></div></div>
    <button class="btn pri" id="mkGo">확인</button><button class="btn sec" id="mkSkip" style="margin-top:10px">모르겠어요 (예문 보기)</button>`;
    $("qBody").innerHTML=h;
    $("mkGo").onclick=()=>{const r=checkMine(w,$("mkT").value);$("mkM").innerHTML=r.msg;$("mkM").style.color=r.ok?"var(--ok)":"var(--bad)";if(r.ok){addMine(w,$("mkT").value.trim());$("mkT").disabled=true;$("mkGo").style.display="none";$("mkSkip").style.display="none";grade(true)}};
    $("mkSkip").onclick=()=>{$("mkGo").style.display="none";$("mkSkip").style.display="none";grade(false)};
    return;
  }
  if(type==="meaning"){
    h=`<div class="qtype">${mode==="test"?"레벨 테스트 · ":""}뜻 고르기</div><div class="qword" style="${w.w.length>14?"font-size:28px":""}">${esc(w.w)}</div><button class="spk" style="align-self:center" data-say="${esc(w.w)}">🔊 발음</button>`;
    const opts=shuffle([w.ko,...distractors(w,"ko")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}${mode==="test"?`<button class="opt" data-v="__idk" style="color:var(--sub)">모르겠어요</button>`:""}</div>`;
  }else if(type==="reverse"){
    h=`<div class="qtype">💬 이럴 때 영어로?</div><div class="qmain">${esc(w.ko)}</div><div class="qsub">상황: ${esc(w.sk)}</div>`;
    const opts=shuffle([w.w,...distractors(w,"w")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }else if(type==="blank"||type==="listen"){
    h=`<div class="qtype">${type==="listen"?"🎧 듣고 빈칸 채우기":"빈칸에 알맞은 단어"}</div>`;
    if(type==="listen")h+=`<button class="spk" id="play">🔊 다시 듣기</button><div class="qsub">${esc(w.sk)}</div>`;
    else h+=`<div class="qmain">${blankS}</div><div class="qsub">${esc(w.sk)}</div>`;
    const opts=shuffle([w.w,...distractors(w,"w")]);
    h+=`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }else{ // type
    h=`<div class="qtype">✍️ 직접 입력</div><div class="qmain">${blankS}</div><div class="qsub">${esc(w.sk)}<br>힌트: <b>${w.w[0]}</b>${"_ ".repeat(w.w.length-1)} (${w.ko})</div>
    <input class="type" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력"><button class="btn pri" id="tgo">확인</button>`;
  }
  $("qBody").innerHTML=h;
  if(type==="listen"){$("play").onclick=()=>speak(w.s);speak(w.s)}
  $("qBody").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v,ans=type==="meaning"?w.ko:w.w,ok=v===ans;

    if(!ok)b.classList.add("wrong");
    grade(ok);
  });
  if(type==="type"){
    const go=()=>{const i=$("tin");if(i.disabled)return;const ok=i.value.trim().toLowerCase()===w.w.toLowerCase();i.disabled=true;i.classList.add(ok?"right":"wrong");$("tgo").style.display="none";grade(ok)};
    $("tgo").onclick=go;$("tin").onkeydown=e=>{if(e.key==="Enter")go()};
    setTimeout(()=>$("tin").focus(),50);
  }
}

function grade(ok){
  const {w}=Q[qi];
  if(mode==="test"){S.recent.push({lv:w.lv,ok});}
  else{
    let c=card(w)||{box:0,due:0,r:0,x:0};
    if(ok){c.box=Math.min(5,c.box+1);c.r++;c.due=Date.now()+INTV[c.box]*DAY}
    else{c.box=0;c.x++;c.due=Date.now();if(!Q.slice(qi+1).some(q=>q.w===w))Q.push({w,type:"meaning"})}
    S.cards[w.id]=c;
    if(ok){combo++;right++;const g=10+(combo>=3?5:0);S.xp+=g;sessXP+=g}else combo=0;
    S.done++;
    S.recent.push({lv:w.lv,ok});S.recent=S.recent.slice(-20);
    adjustLevel();
    save();
  }
  if(mode==="test"&&ok)right++;
  $("fb").className="fb show "+(ok?"ok":"no");
  $("fbH").textContent=ok?(combo>=3?`정답! 🔥 ${combo}연속`:"정답!"):"아쉬워요";
  $("fbS").innerHTML=`${w.e} <b>${esc(w.w)}</b> · ${esc(w.ko)}<br>${esc(w.s)}`;
  $("fbMore").style.display=mode==="test"?"none":"";
  $("fbK").textContent=w.sk;
  if(mode!=="test")speak(w.s);
}
function adjustLevel(){
  const r=S.recent.filter(x=>x.lv>=(S.level||1));
  if(S.recent.length<20||r.length<8)return;
  const acc=r.filter(x=>x.ok).length/r.length;
  if(acc>=.85&&S.level<5){S.level++;S.recent=[];toastLv="⬆️ 레벨 업! Lv."+S.level}
  else if(acc<.5&&S.level>1){S.level--;S.recent=[]}
}
let toastLv="";
$("fbMore").onclick=()=>openDetail(Q[qi].w);
$("fbNext").onclick=()=>{
  $("fb").className="fb";
  qi++;
  if(qi<Q.length){renderQ();return}
  finish();
};
function finish(){
  $("qBar").style.width="100%";
  if(mode==="test"){
    // level = highest level where you got at least one of its words right, counting up while not 0
    let lv=1;for(let l=1;l<=5;l++){const g=S.recent.filter(x=>x.lv===l);if(g.some(x=>x.ok))lv=l;else break}
    S.level=lv;S.recent=[];save();
    $("rEmoji").textContent="🛫";$("rTitle").textContent="당신의 레벨: Lv."+lv;
    $("rTxt").textContent="10문제 중 "+right+"개 정답. 이 레벨부터 시작하고, 실력에 맞춰 자동으로 올라가거나 내려가요.";
    $("rAgain").textContent="학습 시작";$("rAgain").onclick=()=>buildSession("learn");
  }else{
    if(S.lastDay!==today()){S.streak=S.lastDay===new Date(Date.now()-DAY).toDateString()?S.streak+1:1;S.lastDay=today()}
    save();
    const total=Q.filter(q=>q.type!=="intro").length,pct=Math.round(right/total*100);
    $("rEmoji").textContent=pct>=90?"🏆":pct>=60?"🎉":"💪";
    $("rTitle").textContent=toastLv||"세트 완료!";toastLv="";
    $("rTxt").innerHTML=`정답 ${right} / ${total} (${pct}%)<br>+${sessXP} XP · 🔥 ${S.streak}일 연속<br>틀린 단어는 곧 복습에 다시 나와요.`;
    $("rAgain").textContent="한 세트 더";$("rAgain").onclick=()=>buildSession(mode==="review"?"learn":mode);
  }
  show("result");
}
$("qx").onclick=()=>{$("fb").className="fb";if(mode==="test"&&!S.level){show("intro");return}renderHome()};
$("rHome").onclick=renderHome;
$("bLearn").onclick=()=>buildSession("learn");
$("bReview").onclick=()=>buildSession("review");
$("bListen").onclick=()=>buildSession("listen");
$("bTest").onclick=()=>{S.recent=[];buildSession("test")};
$("bRetest").onclick=e=>{e.preventDefault();S.recent=[];buildSession("test")};

// ===== WORDBOOK =====
let bf="all";
function renderBook(){
  let list=W.filter(w=>card(w));
  if(bf==="weak")list=list.filter(w=>card(w).box<=1);
  if(bf==="master")list=list.filter(w=>card(w).box>=4);
  list.sort((a,b)=>card(a).box-card(b).box);
  $("wl").innerHTML=list.length?list.map(w=>{const c=card(w);return `<div class="wi" data-open="${w.id}"><span style="font-size:26px">${w.e}</span><div style="flex:1"><b>${esc(w.w)}</b> <small>${esc(w.ko)} · ${{av:"항공",gen:"단어",ex:"회화"}[w.c]} Lv.${w.lv}</small></div><span class="dots">${"●".repeat(c.box)}${"○".repeat(5-c.box)}</span></div>`}).join(""):`<p class="muted" style="text-align:center;padding:40px 0">아직 단어가 없어요.</p>`;
  show("book");
}
$("bBook").onclick=renderBook;$("bx").onclick=renderHome;
$("bookSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;bf=b.dataset.b;$("bookSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderBook()};

document.addEventListener("click",e=>{const t=e.target.closest("[data-say]");if(t)speak(t.dataset.say)});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
// ===== DETAIL =====
function exRow(en,ko,hide){return `<div class="exi${hide?" hide":""}"><div class="t">${esc(en)}<small>${esc(ko)}</small></div><button class="mini" data-say="${esc(en)}">🔊</button></div>`}
function detailHTML(w,compact){
  const exs=[[w.s,w.sk],...w.m];
  const mine=(S.mine[w.id]||[]);
  let h=`<div class="emo">${w.e}</div><div class="dw">${esc(w.w)} <button class="mini" data-say="${esc(w.w)}">🔊</button></div>
  <div class="dpos">${POS[w.pos]||""} · ${{av:"항공",gen:"단어",ex:"회화"}[w.c]} Lv.${w.lv}</div><div class="dko">${esc(w.ko)}</div>`;
  if(w.x)h+=`<div class="box"><h4>💡 쉽게 이해하기</h4><p>${esc(w.x)}</p></div>`;
  h+=`<div class="box exbox"><h4>📝 예문</h4>${exs.map((e,i)=>exRow(e[0],e[1],i>0)).join("")}${exs.length>1?`<button class="mini moreEx">예문 더 보기 (+${exs.length-1})</button>`:""}</div>`;
  if(!compact){
    h+=`<div class="box mkbox" data-id="${w.id}"><h4>✍️ 나만의 예문 만들기</h4><textarea class="mk" placeholder="${esc(w.w)}를 넣어서 문장을 만들어 보세요" autocapitalize="sentences"></textarea><div class="mkmsg"></div><button class="btn pri mkSave" style="padding:13px">저장하기 (+5 XP)</button>
    <div class="mineList">${mine.map(t=>`<div class="mine">✏️ ${esc(t)}</div>`).join("")}</div>
    <p class="muted" style="font-size:12px;margin-top:8px">단어가 들어갔는지만 자동으로 확인해요. 문법은 위 예문과 비교해 보세요.</p></div>`;
  }
  return h;
}
function openDetail(w){
  $("dIn").innerHTML=`<div class="qtop" style="margin-bottom:0"><button class="x" id="dx">✕</button></div>`+detailHTML(w,false);
  $("detail").classList.add("on");$("detail").scrollTop=0;
  $("dx").onclick=()=>$("detail").classList.remove("on");
}
function stem(x){x=x.toLowerCase();return x.length>4?x.replace(/(e|y|s)$/,""):x}
function checkMine(w,t){
  t=t.trim();const lo=t.toLowerCase();
  if(t.split(/\s+/).length<3)return{ok:false,msg:"3단어 이상으로 문장을 만들어 보세요."};
  const skip=["i'm","it's","let's","that's","don't","you","the","a","i","me","it","can","to"];
  const keys=w.w.toLowerCase().split(" ").filter(k=>!skip.includes(k));
  const has=(keys.length?keys:[w.w.toLowerCase()]).every(k=>lo.includes(stem(k)));
  if(!has)return{ok:false,msg:`문장에 <b>${esc(w.w)}</b>가 들어가야 해요.`};
  let tip="";
  if(!/^[A-Z"']/.test(t))tip+=" 문장 첫 글자는 대문자로!";
  if(!/[.!?"]$/.test(t))tip+=" 끝에 마침표(.)나 물음표(?)를 붙여요.";
  return{ok:true,msg:"좋아요! 👏 저장했어요."+(tip?"<br><span style='color:var(--sub)'>💡"+tip+"</span>":"")};
}
function addMine(w,t){(S.mine[w.id]=S.mine[w.id]||[]).unshift(t);S.xp+=5;save()}
document.addEventListener("click",e=>{
  const m=e.target.closest(".moreEx");
  if(m){const box=m.closest(".exbox");const nx=box.querySelector(".exi.hide");if(nx)nx.classList.remove("hide");const left=box.querySelectorAll(".exi.hide").length;if(!left)m.remove();else m.textContent=`예문 더 보기 (+${left})`;return}
  const sv=e.target.closest(".mkSave");
  if(sv){const box=sv.closest(".mkbox"),w=W[+box.dataset.id],ta=box.querySelector("textarea"),msg=box.querySelector(".mkmsg");
    const r=checkMine(w,ta.value);msg.innerHTML=r.msg;msg.style.color=r.ok?"var(--ok)":"var(--bad)";
    if(r.ok){addMine(w,ta.value.trim());box.querySelector(".mineList").insertAdjacentHTML("afterbegin",`<div class="mine">✏️ ${esc(ta.value.trim())}</div>`);ta.value=""}return}
  const op=e.target.closest("[data-open]");
  if(op){openDetail(W[+op.dataset.open]);return}
});
// ===== START =====
if(!S.level)show("intro");else renderHome();
</script>
</body>
</html>
